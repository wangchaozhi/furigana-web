services:
  api:
    image: ghcr.io/wangchaozhi/furigana-web-api:${FURIGANA_VERSION:-latest}
    environment:
      DB_PATH: /data/furigana.sqlite3
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-5.6-terra}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-https://api.cognitive.microsofttranslator.com}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      BAIDU_TRANSLATE_APP_ID: ${BAIDU_TRANSLATE_APP_ID:-}
      BAIDU_TRANSLATE_SECRET: ${BAIDU_TRANSLATE_SECRET:-}
      YOUDAO_TRANSLATE_APP_KEY: ${YOUDAO_TRANSLATE_APP_KEY:-}
      YOUDAO_TRANSLATE_SECRET: ${YOUDAO_TRANSLATE_SECRET:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: ghcr.io/wangchaozhi/furigana-web-web:${FURIGANA_VERSION:-latest}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped
